services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban_password}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - kanban_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    depends_on:
      database:
        condition: service_healthy

    environment:
      NODE_ENV: development
      PORT: 5000
      APP_URL: http://localhost:5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      DATABASE_URL: postgresql://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-kanban_password}@database:5432/${POSTGRES_DB:-kanban}?schema=public

      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-development-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

    ports:
      - "${BACKEND_PORT:-5000}:5000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  kanban_postgres_data: